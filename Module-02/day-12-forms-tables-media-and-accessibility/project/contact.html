<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Habesha Eatery, Bole</title>
    <meta
      name="description"
      content="Get in touch with Habesha Eatery in Bole, Addis Ababa."
    />
  </head>
  <body>
    <header>
      <h1>Contact Habesha Eatery</h1>
      <nav>
        <a href="index.html">Reservations</a>
        &middot;
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main>
      <div>
        <form method="post">
          <fieldset>
            <legend>Contact Form</legend>
            <div>
              <label for="full_name">Full Name:</label>
              <input type="text" id="full_name" name="full_name" required />
            </div>

            <br />
            <div>
              <label for="email">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="example@domain.com"
                required
              />
            </div>

            <br />
            <div>
              <label for="message">Message:</label>
              <textarea
                name="message"
                id="message"
                placeholder="Type your message here"
                rows="5"
                cols="25"
                required
              ></textarea>
            </div>

            <br />
            <button type="submit">Submit</button>
          </fieldset>
        </form>
      </div>

      <div>
        <table>
          <caption>
            Opening Hours
          </caption>
          <thead>
            <tr>
              <th scope="col">Day</th>
              <th scope="col">Hours</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Monday</td>
              <td>05:15 PM</td>
            </tr>
            <tr>
              <td>Tuesday</td>
              <td>10:00 AM</td>
            </tr>
            <tr>
              <td>Wednesday</td>
              <td>10:00 AM</td>
            </tr>
            <tr>
              <td>Thursday</td>
              <td>10:00 AM</td>
            </tr>
            <tr>
              <td>Friday</td>
              <td>10:00 AM</td>
            </tr>
            <tr>
              <td>Saturday</td>
              <td>09:00 AM</td>
            </tr>
            <tr>
              <td>Sunday</td>
              <td>09:00 AM</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <footer>
      <div>
        <p>Address</p>
        <p>Habesha Eatery</p>
        <p>Namibia street, Bole</p>
        <p>Addis Ababa, Ethiopia</p>
      </div>
    </footer>
  </body>
</html>
