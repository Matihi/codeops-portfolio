<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Table</title>
  </head>
  <body>
    <table>
      <caption>
        Ethiopian Airlines Flight Information
      </caption>
      <thead>
        <tr>
          <th scope="col">Flight</th>
          <th scope="col">From</th>
          <th scope="col">To</th>
          <th scope="col">Departs</th>
          <th scope="col">Price(ETB)</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>100</td>
          <td>Addis Ababa</td>
          <td>Dubai</td>
          <td>07:15 AM</td>
          <td>5000</td>
        </tr>

        <tr>
          <td>101</td>
          <td>Addis Ababa</td>
          <td>Nairobi</td>
          <td>08:30 AM</td>
          <td>4000</td>
        </tr>

        <tr>
          <td>102</td>
          <td>Cairo</td>
          <td>Johannesberg</td>
          <td>09:15 PM</td>
          <td>9000</td>
        </tr>

        <tr>
          <td>103</td>
          <td>Beijing</td>
          <td>Madrid</td>
          <td>11:00 AM</td>
          <td>9000</td>
        </tr>

        <tr>
          <td>104</td>
          <td>Amsterdam</td>
          <td>London</td>
          <td>01:15 PM</td>
          <td>4000</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
