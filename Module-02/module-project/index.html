<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Experience authentic and delicious Ethiopian cuisine"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Addis Eats</title>
  </head>
  <body>
    <header>
      <div class="logo-wrapper">
        <img
          src="./images/addis-eats-logo1.png"
          alt="Addis Eats Logo"
          width="200px"
          height="200px"
        />
      </div>
      <div class="heading-wrapper">
        <h1 class="heading">Addis Eats</h1>
      </div>
      <search class="search-container">
        <input
          type="search"
          id="search"
          class="search"
          placeholder="Search dishes"
        />
      </search>
    </header>
    <main>
      <section id="menu" class="menu" aria-label="Menu">
        <h2>Our Menu</h2>
        <div class="menu-grid"></div>
      </section>
      <aside id="cart" class="cart" aria-label="Your order">
        <h2>Your Order</h2>
        <ul class="cart-ul"></ul>
        <p class="cart-total"></p>
      </aside>

      <form id="checkout" class="checkout" novalidate>
        <h3>Checkout Form</h3>
        <label for="name">
          <span>Name</span>

          <input
            type="text"
            id="name"
            class="name"
            autocomplete="given-name"
            required
          />
        </label>

        <label for="phone-number">
          <span>Phone (TeleBirr)</span>

          <input
            type="tel"
            id="phone-number"
            class="phone-number"
            placeholder="09xxxxxxxx"
            required
          />
        </label>

        <label for="area">
          <span>Delivery Area</span>
          <select name="area" id="area" class="area">
            <option value="select">Select</option>
            <option value="bole">Bole</option>
            <option value="kazanchis">Kazanchis</option>
            <option value="megenagna">Megenagna</option>
            <option value="piassa">Piassa</option>
          </select>
        </label>
        <p id="form-error" class="form-error" aria-live="polite"></p>
        <button type="submit" class="checkout-button">Place order</button>
      </form>
    </main>
    <footer class="footer">
      <p>Bole, Addis Ababa · TeleBirr</p>
    </footer>
    <script src="./app.js"></script>
  </body>
</html>
